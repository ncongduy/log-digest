# Test, build the image, smoke-test it, push it to GHCR.
# PRs stop before the push; main publishes :latest + :sha-<short>.
name: image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"

      - run: go vet ./...

      - run: go test ./...

  image:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=pr
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          build-args: VERSION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Same constraints as the CronJob: read-only root, /tmp writable. The
      # dry run must group the fixture and let none of its secrets through.
      - name: Smoke-test image
        env:
          IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: |
          run() { docker run --rm --read-only --tmpfs /tmp "$@"; }
          run "$IMAGE" --version
          run --entrypoint claude "$IMAGE" --version
          run -v "$PWD/testdata:/testdata:ro" "$IMAGE" --dry-run --input /testdata/loki.json > prompt.txt
          grep -qF '[error] pod flashcard/web' prompt.txt
          if grep -F -f testdata/secrets.txt prompt.txt; then
            echo "::error::a fixture secret survived sanitizing"; exit 1
          fi

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push the exact image that passed the smoke test — no rebuild.
      - name: Push image
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: xargs -n1 docker push <<< "$TAGS"
